name: Trend Scout

# Headless Claude Code scans startups with current traction, extracts the
# mechanism, narrows to a buyer the leader can't serve, and adversarially
# checks that the wedge holds. This agent writes only markdown into its own
# repo — no stateful system to protect — so output commits straight to main:
# one report file + ledger update per run.
#
# The research step only WRITES files (ledger, report, briefs, digest). The
# workflow — not the model — then commits, pushes, and sends the Telegram digest
# in dedicated steps, and FAILS LOUDLY if the run produced no changes. This stops
# a run from silently "succeeding" without committing anything.
#
# Runs in the cloud (laptop off), overnight so it doesn't compete with daytime
# token budget, and avoids Sunday so it doesn't collide with another scheduled
# agent's token usage in the same week.

on:
  schedule:
    # 06:00 UTC Tue/Thu/Sat = 00:00 America/Mexico_City (UTC-6, no DST)
    - cron: "0 6 * * 2,4,6"
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model (sonnet = reliable on subscription quota; opus = deeper but may hit session limits)"
        default: "opus"
        required: false

permissions:
  contents: write   # commit the daily report + ledger update to main

concurrency:
  group: trend-scout
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the run can read prior reports

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name  "trend-scout-bot"
          git config user.email "trend-scout@users.noreply.github.com"

      - name: Run trend research (writes files only)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_MODEL: ${{ github.event.inputs.model || 'opus' }}
        run: |
          claude -p "$(cat automation/trend_research_prompt.md)" \
            --model "$SCOUT_MODEL" \
            --dangerously-skip-permissions

      - name: Commit and push results (guarded)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Research run produced no file changes — nothing to commit. Failing so the run is flagged, not silently 'successful'."
            exit 1
          fi
          echo "Changes to commit:"
          git diff --cached --name-status
          git commit -m "trend-scout: report $(date -u +%F)"
          git push origin HEAD:main

      - name: Send Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DIGEST="reports/$(date -u +%Y)/$(date -u +%F).digest.md"
          if [ -f "$DIGEST" ]; then
            bash automation/telegram_digest.sh "$(cat "$DIGEST")"
            echo "Sent digest from $DIGEST"
          else
            echo "::warning::No digest file at $DIGEST — the run committed, but no Telegram digest was sent."
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Trend Scout workflow FAILED on $(date -u +%F). Check GitHub Actions logs." >/dev/null
